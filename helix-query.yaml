version: 1

indices:
  # Site query index. One row per published page; the adventures listing block
  # reads this at runtime (single source of truth) and filters to adventure
  # detail pages under /{locale}/adventures/. Add an adventure = publish a new
  # page under /{locale}/adventures/<name> with `category` metadata; it is
  # indexed automatically — no listing-page edit.
  default:
    include:
      - '/**'
    exclude:
      - '/drafts/**'
      - '/tools/**'
      - '/nav'
      - '/footer'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: attribute(el, 'content')
      role:
        select: head > meta[name="role"]
        value: attribute(el, 'content')
      group:
        select: head > meta[name="group"]
        value: attribute(el, 'content')
      order:
        select: head > meta[name="order"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
